name = "lean-no-comments"
defaultTargets = ["NoCommentsCore"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[lean_lib]]
name = "NoCommentsCore"
roots = ["NoComments.Core", "NoComments.Config", "NoComments.RatchetCore"]
globs = ["NoComments.Core", "NoComments.Config", "NoComments.RatchetCore"]

[[lean_lib]]
name = "NoCommentsCLI"
roots = ["NoComments.ConfigIO", "NoComments.Ratchet", "NoComments.Runner", "NoComments.LakeEnv", "NoComments.Worker"]
globs = ["NoComments.ConfigIO", "NoComments.Ratchet", "NoComments.Runner", "NoComments.LakeEnv", "NoComments.Worker"]

[[lean_exe]]
name = "no-comments"
root = "NoComments.Main"
supportInterpreter = true
