# Validation configuration for rbeauchamp/lean-no-comments.
# Effective once merged to main; governs subsequent validation runs on the default branch.
#
# Memory bounds: measured on macOS arm64 with /usr/bin/time -l on 2026-11-21:
# - `lake env lean --load-dynlib="$lib" --run NoComments/TestListing.lean`
#   peaked at 2.42 GiB resident (2,601,025,536 B in 1.74 s real).
# - `./.lake/build/bin/no-comments check` peaked at 1.33 GiB resident (1,429,356,544 B in 3.91 s real).
# `heavy_steps.test.memory` reserves 8GiB for the full build, `lake lint`, self-check, and listing.
#
# `no_ci` stays unset because `.github/workflows/ci.yml` reports required pull-request checks.

commands:
  test: |
    set -eu
    lake build --wfail
    lake lint
    lake build no-comments
    ./.lake/build/bin/no-comments check
    libdir="$(lean --print-libdir)"
    lib="$libdir/libLake_shared.dylib"
    [ -e "$lib" ] || lib="$libdir/libLake_shared.so"
    [ -e "$lib" ] || { echo "missing libLake_shared under $libdir" >&2; exit 1; }
    lake env lean --load-dynlib="$lib" --run NoComments/TestListing.lean --check

heavy_steps:
  test:
    memory: 8GiB
    limit: none; measured TestListing 2.42 GiB and no-comments check 1.33 GiB

test:
  no_surface: proceed
  instructions: |
    `lean-no-comments` establishes core comment extraction, token-boundary safety, byte coverage,
    distinct line counting, and multiset monotonicity through kernel-checked proofs in `NoCommentsCore`
    (`NoComments/Core.lean`, `NoComments/Config.lean`, `NoComments/RatchetCore.lean`) plus `lake lint`
    and self-enforcement via `./.lake/build/bin/no-comments check`.
    Decide each claim by what it alters:
    1. Drive `./.lake/build/bin/no-comments` directly on a temporary Git checkout under an ignored task-owned
       directory inside the worktree such as `build/` (and remove the temporary checkout afterward) when a
       change alters CLI flag parsing, git/ratchet resolution, Lake workspace setup, or multi-process worker
       behavior in `NoCommentsCLI` / `NoComments/Main.lean` that is not proved by theorems in `NoCommentsCore`.
       Report exit code and observed output cleanly.
    2. Do not invent live test runs for pure proof changes inside `NoCommentsCore` covered by kernel proofs and
       `lake build --wfail`, or for documentation/policy/CI metadata changes (`no-surface`).
  tests_as_evidence:
    policy: forbid
    list_command: |
      set -eu
      libdir="$(lean --print-libdir)"
      lib="$libdir/libLake_shared.dylib"
      [ -e "$lib" ] || lib="$libdir/libLake_shared.so"
      [ -e "$lib" ] || { echo "missing libLake_shared under $libdir" >&2; exit 1; }
      no-mistakes admit --memory 3GiB --limit "none; measured peak 2.42 GiB resident" -- lake env lean --load-dynlib="$lib" --run NoComments/TestListing.lean

pr:
  template: .github/pull_request_template.md
  appendix: minimal
