name: Install Lean with SHA-256 verification
description: Install the Lean toolchain pinned in lean-toolchain with verified release archive checksums.
runs:
  using: composite
  steps:
    - name: Install Lean from lean-toolchain with SHA-256 verification
      shell: bash
      run: |
        set -euo pipefail
        V="4.36.0"
        TOOLCHAIN="$(tr -d '[:space:]' < lean-toolchain)"
        [ "$TOOLCHAIN" = "leanprover/lean4:v$V" ] || { echo "unexpected lean-toolchain '$TOOLCHAIN'; expected 'leanprover/lean4:v$V' and matching checksums" >&2; exit 1; }
        OS="$(uname -s)"
        ARCH="$(uname -m)"
        if [ "$OS" = "Linux" ] && [ "$ARCH" = "x86_64" ]; then
          PKG="lean-$V-linux"
          SHA="92a996be487b48e1c2f2985be6b150490475c94d02f5a5e26665a9dab780902a"
          SUM_CMD=(sha256sum --check)
        elif [ "$OS" = "Darwin" ] && [ "$ARCH" = "arm64" ]; then
          PKG="lean-$V-darwin_aarch64"
          SHA="35ea8a8eba3d014feb16414610454322f6aad7679f8f0d9f09fb63754bb16e39"
          SUM_CMD=(shasum -a 256 -c)
        else
          echo "unsupported runner $OS/$ARCH" >&2
          exit 1
        fi
        curl -sSfL -o "$RUNNER_TEMP/lean.zip" "https://github.com/leanprover/lean4/releases/download/v$V/$PKG.zip"
        printf '%s  %s\n' "$SHA" "$RUNNER_TEMP/lean.zip" | "${SUM_CMD[@]}"
        unzip -q "$RUNNER_TEMP/lean.zip" -d "$RUNNER_TEMP"
        rm -f "$RUNNER_TEMP/lean.zip"
        echo "$RUNNER_TEMP/$PKG/bin" >> "$GITHUB_PATH"
