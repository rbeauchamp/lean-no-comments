name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, Verify Proofs & Self-Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure origin/main ref exists for merge-base check
        shell: bash
        run: |
          if ! git rev-parse --verify --quiet origin/main^{commit}; then
            git fetch --no-tags origin main:refs/remotes/origin/main
          fi

      - name: Install Lean from lean-toolchain with SHA-256 verification
        uses: ./.github/actions/install-lean

      - name: Build NoCommentsCore, run Regula lint, and build no-comments
        shell: bash
        run: |
          set -euo pipefail
          lake build --wfail
          lake lint
          lake build no-comments

      - name: Verify zero Lean comments via self-check
        shell: bash
        run: |
          set -euo pipefail
          ./.lake/build/bin/no-comments --version
          INV_OUT="$(./.lake/build/bin/no-comments inventory)"
          echo "$INV_OUT"
          ./.lake/build/bin/no-comments check
          echo "$INV_OUT" | grep -q "0 comment(s), 0 line(s)"

      - name: Verify zero forbidden test artifacts via TestListing
        shell: bash
        run: |
          set -euo pipefail
          LIBDIR="$(lean --print-libdir)"
          LIB="$LIBDIR/libLake_shared.dylib"
          [ -e "$LIB" ] || LIB="$LIBDIR/libLake_shared.so"
          [ -e "$LIB" ] || { echo "missing libLake_shared under $LIBDIR" >&2; exit 1; }
          lake env lean --load-dynlib="$LIB" --run NoComments/TestListing.lean --check
