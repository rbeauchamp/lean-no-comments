name: Auto-assign issue

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  assign:
    name: Auto-assign opened issue
    if: ${{ github.event.issue.assignee == null && github.event.issue.assignees[0] == null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Assign issue to eligible human creator or fallback owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          USER_TYPE: ${{ github.event.issue.user.type }}
          CREATOR_NODE_ID: ${{ github.event.issue.user.node_id }}
          TRUSTED_HUMAN_USER_IDS: ${{ vars.TRUSTED_HUMAN_USER_IDS }}
          DEFAULT_ISSUE_OWNER: ${{ vars.DEFAULT_ISSUE_OWNER }}
          REPO_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPO_OWNER_NODE_ID: ${{ github.event.repository.owner.node_id }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          NODE_ID_RE='^[A-Za-z0-9][A-Za-z0-9+/_-]*={0,2}$'
          LOGIN_RE='^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'

          if [[ ! "$ISSUE_NODE_ID" =~ $NODE_ID_RE ]]; then
            echo "Invalid issue node ID: ${ISSUE_NODE_ID}" >&2
            exit 1
          fi

          trusted_human_ids=()
          if [[ -n "$TRUSTED_HUMAN_USER_IDS" ]]; then
            while IFS= read -r token; do
              if [[ -z "$token" ]]; then
                continue
              fi
              if [[ ! "$token" =~ $NODE_ID_RE ]]; then
                echo "Invalid trusted human user node ID: ${token}" >&2
                exit 1
              fi
              trusted_human_ids+=("$token")
            done < <(printf '%s\n' "$TRUSTED_HUMAN_USER_IDS" | tr ', \t\r' '\n')
            if (( ${#trusted_human_ids[@]} == 0 )); then
              echo "Invalid trusted human user node ID list" >&2
              exit 1
            fi
          fi

          assignee_id=""
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              if [[ "$USER_TYPE" == "User" ]]; then
                if [[ ! "$CREATOR_NODE_ID" =~ $NODE_ID_RE ]]; then
                  echo "Invalid creator node ID: ${CREATOR_NODE_ID}" >&2
                  exit 1
                fi
                if (( ${#trusted_human_ids[@]} > 0 )); then
                  for trusted_id in "${trusted_human_ids[@]}"; do
                    if [[ "$trusted_id" == "$CREATOR_NODE_ID" ]]; then
                      assignee_id="$CREATOR_NODE_ID"
                      break
                    fi
                  done
                fi
              fi
              ;;
          esac

          if [[ -z "$assignee_id" ]]; then
            if [[ -n "$DEFAULT_ISSUE_OWNER" ]]; then
              if [[ ! "$DEFAULT_ISSUE_OWNER" =~ $LOGIN_RE || "$DEFAULT_ISSUE_OWNER" == *--* ]]; then
                echo "Invalid default issue owner login: ${DEFAULT_ISSUE_OWNER}" >&2
                exit 1
              fi
              user_query="$(cat <<'GRAPHQL'
          query($login: String!) {
            user(login: $login) {
              id
            }
          }
          GRAPHQL
              )"
              user_response="$(
                gh api graphql \
                  -f query="$user_query" \
                  -f login="$DEFAULT_ISSUE_OWNER"
              )"
              if ! assignee_id="$(
                printf '%s' "$user_response" | jq -er '
                  if ((.errors // []) | length == 0) and (.data.user.id | type == "string") then
                    .data.user.id
                  else
                    empty
                  end
                '
              )"; then
                echo "Failed to resolve default issue owner ${DEFAULT_ISSUE_OWNER}: ${user_response}" >&2
                exit 1
              fi
            elif [[ "$REPO_OWNER_TYPE" == "User" ]]; then
              assignee_id="$REPO_OWNER_NODE_ID"
            else
              echo "Repository owner is not an assignable user; set vars.DEFAULT_ISSUE_OWNER" >&2
              exit 1
            fi
          fi

          if [[ ! "$assignee_id" =~ $NODE_ID_RE ]]; then
            echo "Invalid resolved assignee node ID: ${assignee_id}" >&2
            exit 1
          fi

          assign_mutation="$(cat <<'GRAPHQL'
          mutation($issueId: ID!, $assigneeId: ID!) {
            addAssigneesToAssignable(input: {assignableId: $issueId, assigneeIds: [$assigneeId]}) {
              assignable {
                __typename
                ... on Issue {
                  id
                  assignees(first: 100) {
                    nodes {
                      id
                    }
                  }
                }
              }
            }
          }
          GRAPHQL
          )"
          response="$(
            gh api graphql \
              -f query="$assign_mutation" \
              -f issueId="$ISSUE_NODE_ID" \
              -f assigneeId="$assignee_id"
          )"
          if ! printf '%s' "$response" | jq -e --arg issue_id "$ISSUE_NODE_ID" --arg assignee_id "$assignee_id" '
            ((.errors // []) | length == 0)
            and (.data.addAssigneesToAssignable.assignable.__typename == "Issue")
            and (.data.addAssigneesToAssignable.assignable.id == $issue_id)
            and ((.data.addAssigneesToAssignable.assignable.assignees.nodes // []) | any(.id == $assignee_id))
          ' >/dev/null; then
            echo "Failed to assign issue ${ISSUE_NODE_ID} to ${assignee_id}: ${response}" >&2
            exit 1
          fi
