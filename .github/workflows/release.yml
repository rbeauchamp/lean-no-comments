name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-latest
            target: darwin-arm64

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runner architecture matches target
        shell: bash
        run: |
          ARCH="$(uname -m)"
          echo "Runner architecture: $ARCH"
          if [ "${{ matrix.target }}" = "darwin-arm64" ] && [ "$ARCH" != "arm64" ]; then
            echo "Expected arm64 runner for darwin-arm64, got $ARCH"
            exit 1
          fi
          if [ "${{ matrix.target }}" = "linux-x86_64" ] && [ "$ARCH" != "x86_64" ]; then
            echo "Expected x86_64 runner for linux-x86_64, got $ARCH"
            exit 1
          fi

      - name: Fetch origin/main for merge-base self-check
        run: |
          if ! git rev-parse --verify --quiet origin/main^{commit}; then
            git fetch --no-tags origin main:refs/remotes/origin/main
          fi

      - name: Install elan and Lean toolchain
        shell: bash
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < lean-toolchain)"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build release binary
        run: lake build

      - name: Verify axioms and run self-check
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(partial|sorry|sorryAx|axiom|unsafe|implemented_by|extern)\b' NoComments/Core.lean; then
            echo "Found forbidden keyword in NoComments/Core.lean"
            exit 1
          fi
          THMS="$(grep -E '^theorem ' NoComments/Core.lean | sed -E 's/^theorem ([^ ({:]+).*/\1/')"
          AXIOM_OUT="$(
            {
              echo "import NoComments.Core"
              printf '%s\n' "$THMS" | sed 's/^/#print axioms NoComments.Core./'
            } | lake env lean --stdin
          )"
          THM_LIST="$THMS" AXIOM_TEXT="$AXIOM_OUT" python3 - <<'PY'
          import os, re
          thms = [t.strip() for t in os.environ["THM_LIST"].splitlines() if t.strip()]
          lines = [l.strip() for l in os.environ["AXIOM_TEXT"].splitlines() if l.strip()]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          seen = {}
          for line in lines:
              m = re.match(r"^'NoComments\.Core\.([^']+)' depends on axioms: \[(.*)\]$", line)
              if m:
                  name = m.group(1)
                  axioms = [a.strip() for a in m.group(2).split(",") if a.strip()]
                  bad = set(axioms) - allowed
                  if bad:
                      raise SystemExit(f"Forbidden axioms for {name}: {sorted(bad)}")
                  seen[name] = axioms
                  continue
              m2 = re.match(r"^'NoComments\.Core\.([^']+)' does not depend on any axioms$", line)
              if m2:
                  seen[m2.group(1)] = []
                  continue
              raise SystemExit(f"Unexpected #print axioms line: {line}")
          missing = set(thms) - set(seen)
          if missing:
              raise SystemExit(f"Missing axiom check for theorems: {sorted(missing)}")
          print(f"Verified {len(thms)}/{len(thms)} Core theorems strictly within allowlist {sorted(allowed)}")
          PY
          ./.lake/build/bin/no-comments check --base-ref origin/main

      - name: Stage binary and SHA-256 checksum
        shell: bash
        run: |
          mkdir -p dist
          BIN_NAME="no-comments-${{ matrix.target }}"
          cp .lake/build/bin/no-comments "dist/${BIN_NAME}"
          chmod +x "dist/${BIN_NAME}"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${BIN_NAME}" > "${BIN_NAME}.sha256"
            else
              shasum -a 256 "${BIN_NAME}" > "${BIN_NAME}.sha256"
            fi
          )
          cat "dist/${BIN_NAME}.sha256"

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  publish-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify checksums before publishing
        shell: bash
        run: |
          cd release-assets
          sha256sum -c no-comments-linux-x86_64.sha256
          sha256sum -c no-comments-darwin-arm64.sha256

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
