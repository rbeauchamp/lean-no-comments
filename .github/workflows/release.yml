name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-release-binaries:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-latest
            target: darwin-arm64

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout matches tagged commit
        shell: bash
        run: &verify_tag_checkout |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ] || [ -z "${GITHUB_SHA:-}" ] || [ "$HEAD_SHA" != "${GITHUB_SHA}" ]; then
            echo "Expected tag checkout at ${GITHUB_SHA:-<unset>}, got ref_type=${GITHUB_REF_TYPE:-<unset>} HEAD=${HEAD_SHA}" >&2
            exit 1
          fi

      - name: Verify SemVer tag and NoComments/Main.lean toolVersion parity
        shell: bash
        run: &verify_tag_version_parity |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ.get("GITHUB_REF_NAME", "")
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag, re.ASCII):
              raise SystemExit(
                  f"Expected canonical SemVer tag v<MAJOR.MINOR.PATCH> (no leading zeros), got {tag!r}"
              )
          expected_version = tag[1:]
          text = pathlib.Path("NoComments/Main.lean").read_text(encoding="utf-8")
          lines = text.split("\n")

          def is_id_char(c: str) -> bool:
              return c.isalnum() or c in "_'!?"

          def strip_string_literals(src: str):
              out = []
              interp_spans = []
              n = len(src)
              char_lit_re = re.compile(r"'(?:\\(?:x[0-9a-fA-F]{2}|u[0-9a-fA-F]{4}|.)|[^'\\\n])'")

              def blank(segment: str) -> str:
                  return "".join("\n" if c == "\n" else " " for c in segment)

              def scan_string(start: int, interpolated: bool, track_spans: bool) -> int:
                  j = start + 1
                  while j < n:
                      c = src[j]
                      if c == "\\":
                          if j + 1 >= n:
                              raise SystemExit("Unclosed string literal in NoComments/Main.lean")
                          j += 2
                      elif interpolated and c == "{":
                          out.append(blank(src[start:j]))
                          out.append("{")
                          hole_start = j + 1
                          j = scan_segment(hole_start, stop_on_rbrace=True)
                          if track_spans:
                              interp_spans.append((hole_start, j - 1))
                          start = j
                      elif c == '"':
                          out.append(blank(src[start : j + 1]))
                          return j + 1
                      else:
                          j += 1
                  raise SystemExit("Unclosed string literal in NoComments/Main.lean")

              def scan_segment(i: int, stop_on_rbrace: bool = False) -> int:
                  brace_depth = 0
                  while i < n:
                      ch = src[i]
                      if stop_on_rbrace:
                          if ch == "{":
                              brace_depth += 1
                              out.append(ch)
                              i += 1
                              continue
                          if ch == "}":
                              out.append(ch)
                              if brace_depth == 0:
                                  return i + 1
                              brace_depth -= 1
                              i += 1
                              continue
                      if ch == "r" and (i == 0 or not is_id_char(src[i - 1])) and i + 1 < n and src[i + 1] == "#":
                          j = i + 1
                          while j < n and src[j] == "#":
                              j += 1
                          if j < n and src[j] == '"':
                              end_delim = '"' + ("#" * (j - i - 1))
                              end = src.find(end_delim, j + 1)
                              if end == -1:
                                  raise SystemExit("Unclosed raw string literal in NoComments/Main.lean")
                              out.append(blank(src[i : end + len(end_delim)]))
                              i = end + len(end_delim)
                              continue
                      if ch == "'" and (i == 0 or not is_id_char(src[i - 1])):
                          cm = char_lit_re.match(src, i)
                          if cm:
                              out.append(blank(cm.group(0)))
                              i = cm.end()
                              continue
                      if ch == '"':
                          is_s_interp = i >= 2 and src[i - 2 : i] == "s!" and (i == 2 or not is_id_char(src[i - 3]))
                          interpolated = i > 0 and src[i - 1] == "!"
                          i = scan_string(i, interpolated, track_spans=(is_s_interp and not stop_on_rbrace))
                          continue
                      out.append(ch)
                      i += 1
                  if stop_on_rbrace:
                      raise SystemExit("Unclosed interpolation in NoComments/Main.lean")
                  return i

              scan_segment(0)
              return "".join(out), interp_spans

          stripped, interp_spans = strip_string_literals(text)

          allowed_non_ascii = {"·", "×", "←", "⟨", "⟩"}
          for pos, ch in enumerate(stripped):
              if not ((32 <= ord(ch) <= 126) or ch in ("\t", "\n") or ch in allowed_non_ascii):
                  line_no = stripped.count("\n", 0, pos) + 1
                  raise SystemExit(
                      f"Unsupported character {ch!r} outside string literal at NoComments/Main.lean:{line_no}"
                  )
          if "--" in stripped or "/-" in stripped:
              raise SystemExit("Unexpected Lean comment syntax outside string literal in NoComments/Main.lean")

          id_char_cls = r"A-Za-z0-9_'!?"
          col0_allow_re = re.compile(
              r"^(?:"
              r"(?:import|open|namespace|set_option|variable|def|abbrev|theorem|structure|inductive)\s"
              r"|(?:section|end)(?:\s|$)"
              r"|(?:private|protected|noncomputable|partial|unsafe)\s+(?:def|abbrev|theorem|structure|inductive)\s"
              r")",
              re.ASCII,
          )
          stripped_lines = stripped.split("\n")
          for idx, sline in enumerate(stripped_lines):
              if sline.strip(" \t") == "" or sline[0] in (" ", "\t"):
                  continue
              if not col0_allow_re.match(sline):
                  raise SystemExit(
                      f"Unsupported top-level syntax at NoComments/Main.lean:{idx + 1}: {lines[idx]!r}"
                  )

          if "`(" in stripped or "`[" in stripped:
              raise SystemExit("Unsupported syntax quotation outside string literal in NoComments/Main.lean")
          forbidden_tok_re = re.compile(
              rf"(?<![{id_char_cls}])(?:"
              r"binder_predicate|macro_rules|macro|syntax|elab_rules|elab|notation"
              r"|infixl|infixr|infix|prefix|postfix|declare_syntax_cat|attribute"
              r"|builtin_initialize|initialize|export|opaque|axiom|instance|class"
              rf")(?![{id_char_cls}])",
              re.ASCII,
          )
          fm = forbidden_tok_re.search(stripped)
          if fm:
              line_no = stripped.count("\n", 0, fm.start()) + 1
              raise SystemExit(
                  f"Unsupported Lean construct {fm.group(0)!r} at NoComments/Main.lean:{line_no}"
              )

          ident_part = rf"[A-Za-z_][{id_char_cls}]*"
          tool_version_re = re.compile(
              rf"(?<![{id_char_cls}])(?:{ident_part}\.)*toolVersion(?![{id_char_cls}]|\.(?!\{{))",
              re.ASCII,
          )
          outside_matches = []
          for tm in tool_version_re.finditer(stripped):
              tok = tm.group(0)
              line_no = stripped.count("\n", 0, tm.start()) + 1
              if "." in tok:
                  raise SystemExit(
                      f"Unexpected qualified toolVersion reference {tok!r} at NoComments/Main.lean:{line_no}"
                  )
              containing = next(((s, e) for s, e in interp_spans if s <= tm.start() and tm.end() <= e), None)
              if containing is not None:
                  if stripped[containing[0] : containing[1]].strip() != "toolVersion":
                      raise SystemExit(
                          f"Unsupported interpolation containing toolVersion at NoComments/Main.lean:{line_no}"
                      )
              else:
                  outside_matches.append(tm.start())

          if len(outside_matches) != 1:
              raise SystemExit(
                  f"Expected exactly one non-interpolated toolVersion in NoComments/Main.lean, found {len(outside_matches)}"
              )

          decl_line_idx = stripped.count("\n", 0, outside_matches[0])
          decl_line = lines[decl_line_idx]
          def_re = re.compile(r'^private def toolVersion : String := "([^"\\]+)"$', re.ASCII)
          m = def_re.fullmatch(decl_line)
          if not m:
              raise SystemExit(
                  f"Expected canonical column-0 private def toolVersion at NoComments/Main.lean:{decl_line_idx + 1}, got {decl_line!r}"
              )
          found_version = m.group(1)

          next_idx = decl_line_idx + 1
          while next_idx < len(lines) and lines[next_idx].strip(" \t") == "":
              next_idx += 1
          if next_idx < len(lines) and not col0_allow_re.match(stripped_lines[next_idx]):
              raise SystemExit(
                  f"Unexpected continuation after toolVersion at NoComments/Main.lean:{next_idx + 1}: {lines[next_idx]!r}"
              )

          if found_version != expected_version:
              raise SystemExit(
                  f"Tag version {expected_version!r} does not match NoComments/Main.lean toolVersion {found_version!r}"
              )
          print(f"Verified tag {tag} matches NoComments/Main.lean toolVersion={found_version}")
          PY

      - name: Verify runner architecture matches target
        shell: bash
        run: |
          ARCH="$(uname -m)"
          echo "Runner architecture: $ARCH"
          if [ "${{ matrix.target }}" = "darwin-arm64" ] && [ "$ARCH" != "arm64" ]; then
            echo "Expected arm64 runner for darwin-arm64, got $ARCH"
            exit 1
          fi
          if [ "${{ matrix.target }}" = "linux-x86_64" ] && [ "$ARCH" != "x86_64" ]; then
            echo "Expected x86_64 runner for linux-x86_64, got $ARCH"
            exit 1
          fi

      - name: Fetch origin/main for merge-base self-check
        shell: bash
        run: |
          if ! git rev-parse --verify --quiet 'origin/main^{commit}'; then
            git fetch --no-tags origin main:refs/remotes/origin/main
          fi

      - name: Install Lean from lean-toolchain with SHA-256 verification
        uses: ./.github/actions/install-lean

      - name: Build NoCommentsCore, run Regula lint, and build release binary
        shell: bash
        run: |
          set -euo pipefail
          lake build --wfail
          lake lint
          lake build no-comments
          (cd specification && lake build --wfail)

      - name: Run self-check and TestListing verification
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          VER_OUT="$(./.lake/build/bin/no-comments --version)"
          echo "$VER_OUT"
          VER_PREFIX="no-comments ${EXPECTED_VERSION} (Lean "
          VER_TAIL="${VER_OUT#"$VER_PREFIX"}"
          VER_META="${VER_TAIL%)}"
          if [[ "$VER_OUT" != "${VER_PREFIX}"* ]] || [[ "$VER_TAIL" != *")" ]] || [[ -z "$VER_META" ]] || [[ "$VER_META" == *"("* ]] || [[ "$VER_META" == *")"* ]] || [[ "$VER_META" == *$'\n'* ]] || [[ "$VER_META" == *$'\r'* ]]; then
            echo "Binary --version output '${VER_OUT}' does not match tag version '${EXPECTED_VERSION}'" >&2
            exit 1
          fi
          INV_OUT="$(./.lake/build/bin/no-comments inventory)"
          echo "$INV_OUT"
          ./.lake/build/bin/no-comments check --base-ref origin/main
          echo "$INV_OUT" | grep -q "0 comment(s), 0 line(s)"
          LIBDIR="$(lean --print-libdir)"
          LIB="$LIBDIR/libLake_shared.dylib"
          [ -e "$LIB" ] || LIB="$LIBDIR/libLake_shared.so"
          [ -e "$LIB" ] || { echo "missing libLake_shared under $LIBDIR" >&2; exit 1; }
          lake env lean -DwarningAsError=true --load-dynlib="$LIB" --run NoComments/TestListing.lean --check

      - name: Stage binary and SHA-256 checksum
        shell: bash
        run: |
          mkdir -p dist
          BIN_NAME="no-comments-${{ matrix.target }}"
          cp .lake/build/bin/no-comments "dist/${BIN_NAME}"
          chmod +x "dist/${BIN_NAME}"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${BIN_NAME}" > "${BIN_NAME}.sha256"
            else
              shasum -a 256 "${BIN_NAME}" > "${BIN_NAME}.sha256"
            fi
          )
          cat "dist/${BIN_NAME}.sha256"

      - name: Upload target artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  publish-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository at tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Verify checkout matches tagged commit
        working-directory: src
        shell: bash
        run: *verify_tag_checkout

      - name: Verify SemVer tag and NoComments/Main.lean toolVersion parity
        working-directory: src
        shell: bash
        run: *verify_tag_version_parity

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify checksums before publishing
        shell: bash
        run: |
          cd release-assets
          sha256sum -c no-comments-linux-x86_64.sha256
          sha256sum -c no-comments-darwin-arm64.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ] || [ -z "$TAG" ] || [ -z "${GITHUB_SHA:-}" ]; then
            echo "Expected tag push with GITHUB_REF_NAME and GITHUB_SHA set" >&2
            exit 1
          fi
          ENCODED_TAG="$(jq -rn --arg tag "$TAG" '$tag | split("/") | map(@uri) | join("/")')"
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ENCODED_TAG}")"
          REF_NAME="$(printf '%s' "$REF_JSON" | jq -r '.ref')"
          OBJ_TYPE="$(printf '%s' "$REF_JSON" | jq -r '.object.type')"
          OBJ_SHA="$(printf '%s' "$REF_JSON" | jq -r '.object.sha')"
          if [ "$REF_NAME" != "refs/tags/${TAG}" ]; then
            echo "Expected ref refs/tags/${TAG}, got ${REF_NAME}" >&2
            exit 1
          fi
          while [ "$OBJ_TYPE" = "tag" ]; do
            TAG_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJ_SHA}")"
            OBJ_TYPE="$(printf '%s' "$TAG_JSON" | jq -r '.object.type')"
            OBJ_SHA="$(printf '%s' "$TAG_JSON" | jq -r '.object.sha')"
          done
          if [ "$OBJ_TYPE" != "commit" ] || [ "$OBJ_SHA" != "${GITHUB_SHA}" ]; then
            echo "Remote tag '${TAG}' resolves to ${OBJ_TYPE}:${OBJ_SHA}, expected commit:${GITHUB_SHA}" >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "$TAG" --generate-notes --verify-tag
